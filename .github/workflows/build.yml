name: Build module

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read module version
        id: module
        shell: bash
        run: |
          version="$(awk -F= '$1 == "version" { print $2; exit }' module.prop | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "module.prop version must be MAJOR.MINOR.PATCH; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version (v$version)"
      - name: Check GitHub release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.module.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; it will not be recreated."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist; this run will create it."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check shell syntax
        run: |
          for script in scripts/customize.sh scripts/service.sh scripts/post-fs-data.sh scripts/post-mount.sh scripts/uninstall.sh scripts/verify.sh scripts/nfcconf scripts/uidctl lib/*.sh; do
            sh -n "$script"
          done
      - name: Test core and routing configuration storage
        run: |
          python tools/test_core.py
          python tools/test_routing.py
      - name: Build unsigned module ZIP
        run: python tools/build_module.py
      - name: Verify ZIP checksums
        env:
          VERSION: ${{ steps.module.outputs.version }}
        run: |
          package="galaxy_watch_nfc_provide-v${VERSION}.zip"
          test -f "$package"
          sha256sum --check "${package}.sha256"
        working-directory: dist
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.module.outputs.tag }}
          VERSION: ${{ steps.module.outputs.version }}
        run: |
          package="dist/galaxy_watch_nfc_provide-v${VERSION}.zip"
          checksum="${package}.sha256"
          test -f "$package"
          test -f "$checksum"
          test -f dist/build-report.json
          gh release create "$TAG" \
            "$package" \
            "$checksum" \
            dist/build-report.json \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG"
