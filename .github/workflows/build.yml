name: Build module

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read module version
        id: module
        shell: bash
        run: |
          version="$(awk -F= '$1 == "version" { print $2; exit }' module.prop | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "module.prop version must be MAJOR.MINOR.PATCH; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version (v$version)"
      - name: Check GitHub release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.module.outputs.tag }}
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [[ -z "$release_json" || "$(jq -r 'has("id")' <<< "$release_json")" != true ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "draft_id=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist; this run will create it."
          else
            draft="$(jq -r '.draft' <<< "$release_json")"
            if [[ "$draft" == true ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "draft_id=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_OUTPUT"
              echo "Found an existing draft for $TAG; it will be completed."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "draft_id=" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; it will not be recreated."
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check shell syntax
        run: |
          for script in scripts/customize.sh scripts/service.sh scripts/post-fs-data.sh scripts/post-mount.sh scripts/uninstall.sh scripts/verify.sh scripts/nfcconf scripts/uidctl lib/*.sh; do
            sh -n "$script"
          done
      - name: Test core and routing configuration storage
        run: |
          python tools/test_core.py
          python tools/test_reader.py
          python tools/test_routing.py
      - name: Build unsigned module ZIP
        run: python tools/build_module.py
      - name: Verify ZIP checksums
        env:
          VERSION: ${{ steps.module.outputs.version }}
        run: |
          package="galaxy_watch_nfc_provide-v${VERSION}.zip"
          test -f "$package"
          sha256sum --check "${package}.sha256"
        working-directory: dist
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.module.outputs.tag }}
          VERSION: ${{ steps.module.outputs.version }}
          DRAFT_ID: ${{ steps.release.outputs.draft_id }}
        run: |
          package="dist/galaxy_watch_nfc_provide-v${VERSION}.zip"
          checksum="${package}.sha256"
          test -f "$package"
          test -f "$checksum"
          test -f dist/build-report.json
          release_id="$DRAFT_ID"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '.id')"
          fi
          gh release upload "$TAG" "$package" "$checksum" dist/build-report.json --clobber
          published="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false)"
          if [[ "$(jq -r '.immutable' <<< "$published")" != true ]]; then
            echo "GitHub did not publish an immutable release. Enable repository release immutability first." >&2
            exit 1
          fi
